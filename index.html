<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Jockey Plaza - Catálogo B2B</title>
  <link href="https://i.ibb.co/PZq8hDkT/Whats-App-Image-2026-03-02-at-11-05-39.jpg" src="logo.jpg" alt="Samsung Jockey Plaza" onerror="this.style.display='none" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #1428A0;
      --primary-light: #4fc3f7;
      --dark: #0a0a0a;
      --dark-card: #1a1a2e;
      --dark-light: #2d2d44;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.7);
      --accent: #FFD700;
      --success: #25D366;
      --border: rgba(79,195,247,0.2);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #1a1a2e 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, rgba(20,40,160,0.95) 0%, rgba(79,195,247,0.1) 100%);
      backdrop-filter: blur(10px);
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(20,40,160,0.2);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-area img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 2px solid var(--primary-light);
      background: rgba(255,255,255,0.1);
      padding: 4px;
    }

    .logo-text h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 0.75rem;
      color: var(--primary-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .header-badge {
      background: rgba(255,215,0,0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* HERO */
    .hero {
      background: linear-gradient(180deg, rgba(20,40,160,0.8) 0%, rgba(10,10,10,0.8) 100%), 
                  url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(79,195,247,0.05)" stroke-width="1"/></pattern></defs><rect width="1200" height="600" fill="url(%23grid)"/></svg>');
      background-attachment: fixed;
      padding: 80px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(79,195,247,0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(20,40,160,0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 30px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* SEARCH */
    .search-container {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    #searchInput {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    #searchInput::placeholder {
      color: rgba(255,255,255,0.4);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--primary-light);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 20px rgba(79,195,247,0.2);
    }

    /* TABS */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .tab-btn {
      padding: 12px 24px;
      border: 2px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
    }

    .tab-btn:hover {
      border-color: var(--primary-light);
      color: var(--primary-light);
      background: rgba(79,195,247,0.05);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), rgba(79,195,247,0.3));
      border-color: var(--primary-light);
      color: var(--text);
      box-shadow: 0 0 20px rgba(79,195,247,0.3);
    }

    /* VIEW TOGGLE */
    .view-toggle {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .view-btn {
      padding: 10px 18px;
      border: 2px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .view-btn:hover {
      border-color: var(--primary-light);
      color: var(--primary-light);
    }

    .view-btn.active {
      background: linear-gradient(135deg, var(--primary), rgba(79,195,247,0.3));
      border-color: var(--primary-light);
      color: var(--text);
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .product-card {
      background: linear-gradient(135deg, rgba(45,45,68,0.5) 0%, rgba(26,26,46,0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      position: relative;
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(79,195,247,0.1) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .product-card:hover {
      border-color: var(--primary-light);
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(79,195,247,0.2);
    }

    .product-card:hover::before {
      opacity: 1;
    }

    .product-image-container {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, rgba(20,40,160,0.1) 0%, rgba(79,195,247,0.05) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .product-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .product-img-placeholder {
      font-size: 3.5rem;
      opacity: 0.3;
    }

    .product-info {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-familia {
      background: rgba(79,195,247,0.15);
      color: var(--primary-light);
      padding: 6px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
      letter-spacing: 0.5px;
    }

    .product-name {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--text);
    }

    .price-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .price-pix {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .price-pix span {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      font-weight: 500;
    }

    .price-parcel {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .obs-badge {
      background: rgba(255,215,0,0.15);
      color: var(--accent);
      padding: 8px 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      border-left: 3px solid var(--accent);
      font-weight: 500;
    }

    /* TABLE */
    .table-container {
      display: none;
      overflow-x: auto;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(45,45,68,0.3);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    th {
      background: linear-gradient(135deg, var(--primary), rgba(79,195,247,0.3));
      padding: 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      font-size: 0.95rem;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    tr:hover {
      background: rgba(79,195,247,0.05);
    }

    .td-familia {
      color: var(--primary-light);
      font-weight: 600;
    }

    .td-pix {
      color: var(--accent);
      font-weight: 700;
    }

    /* FOOTER */
    footer {
      background: linear-gradient(180deg, rgba(10,10,10,0.8) 0%, rgba(20,40,160,0.3) 100%);
      padding: 40px 20px;
      text-align: center;
      margin-top: 60px;
      border-top: 1px solid var(--border);
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    /* WHATSAPP */
    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--success), #1fad5f);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37,211,102,0.4);
      transition: all 0.3s ease;
      z-index: 50;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .whatsapp-float:hover {
      transform: scale(1.15) translateY(-5px);
      box-shadow: 0 12px 32px rgba(37,211,102,0.6);
    }

    .whatsapp-float svg {
      width: 35px;
      height: 35px;
      fill: white;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hero h2 {
        font-size: 2rem;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }

      .tabs {
        gap: 8px;
      }

      .tab-btn {
        padding: 10px 16px;
        font-size: 0.85rem;
      }
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo-area">
      <img src="https://i.ibb.co/PZq8hDkT/Whats-App-Image-2026-03-02-at-11-05-39.jpg" alt="Samsung">
      <div class="logo-text">
        <h1>Samsung Jockey Plaza</h1>
        <p>Catálogo B2B Corporativo</p>
      </div>
    </div>
    <div class="header-badge" id="updateBadge">📋 Carregando...</div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h2>Soluções Samsung Premium</h2>
    <p>Equipamentos de alta performance com condições especiais para pessoa jurídica</p>
    
    <!-- SEARCH -->
    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Buscar produto (Galaxy S25, Watch, Buds...)" onkeyup="searchProducts(this.value)">
      </div>
    </div>
  </div>
</section>

<!-- TABS -->
<div class="tabs" id="tabsContainer"></div>

<!-- VIEW TOGGLE -->
<div class="view-toggle">
  <button class="view-btn active" onclick="setView(currentSection, 'grid')">⊞ Grade</button>
  <button class="view-btn" onclick="setView(currentSection, 'table')">☰ Tabela</button>
</div>

<!-- GRID VIEW -->
<div class="grid" id="grid-smartphones"></div>
<div class="grid" id="grid-dobráveis" style="display:none;"></div>
<div class="grid" id="grid-tablets" style="display:none;"></div>
<div class="grid" id="grid-notebooks" style="display:none;"></div>
<div class="grid" id="grid-wearables" style="display:none;"></div>
<div class="grid" id="grid-acessorios" style="display:none;"></div>

<!-- TABLE VIEW -->
<div class="table-container" id="table-smartphones"></div>
<div class="table-container" id="table-dobráveis"></div>
<div class="table-container" id="table-tablets"></div>
<div class="table-container" id="table-notebooks"></div>
<div class="table-container" id="table-wearables"></div>
<div class="table-container" id="table-acessorios"></div>

<!-- FOOTER -->
<footer>
  <p>© 2026 Samsung Jockey Plaza — Catálogo B2B Corporativo | Preços sujeitos a alteração sem aviso prévio</p>
</footer>

<!-- WHATSAPP -->
<a href="https://wa.me/5541984481469?text=Olá! Tenho interesse no catálogo B2B Samsung Jockey Plaza." 
   class="whatsapp-float" target="_blank" title="Falar no WhatsApp">

<script>
let CATALOG = {};
let currentSection = 'smartphones';
let viewState = {};

// CARREGAR CATÁLOGO
async function loadCatalog() {
  try {
    const response = await fetch('precos.json');
    if (response.ok) {
      CATALOG = await response.json();
      console.log('✅ Catálogo carregado com sucesso');
    } else {
      throw new Error('Arquivo não encontrado');
    }
  } catch (error) {
    console.error('❌ Erro ao carregar precos.json:', error);
    alert('⚠️ Erro: Certifique-se de que o arquivo precos.json está na mesma pasta do HTML');
    return;
  }

  const lastUpdated = CATALOG.lastUpdated || new Date().toISOString().split('T')[0];
  document.getElementById('updateBadge').textContent = `📋 Atualizado em ${lastUpdated}`;

  renderTabs();
  renderSection(currentSection);
}

// RENDERIZAR ABAS
function renderTabs() {
  const container = document.getElementById('tabsContainer');
  const sections = Object.keys(CATALOG.categories || {});
  
  container.innerHTML = sections.map(section => `
    <button class="tab-btn ${section === currentSection ? 'active' : ''}" 
            onclick="switchSection('${section}')">
      ${getTabLabel(section)}
    </button>
  `).join('');
}

function getTabLabel(section) {
  const labels = {
    'smartphones': '📱 Smartphones',
    'dobráveis': '📂 Dobráveis',
    'tablets': '📊 Tablets',
    'notebooks': '💻 Notebooks',
    'wearables': '⌚ Wearables',
    'acessorios': '🎧 Acessórios'
  };
  return labels[section] || section;
}

// TROCAR SEÇÃO
function switchSection(section) {
  currentSection = section;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  
  document.querySelectorAll('.grid, .table-container').forEach(el => el.style.display = 'none');
  
  const view = viewState[section] || 'grid';
  if (view === 'grid') {
    document.getElementById(`grid-${section}`).style.display = 'grid';
  } else {
    document.getElementById(`table-${section}`).style.display = 'block';
  }
  
  renderSection(section);
}

// RENDERIZAR SEÇÃO
function renderSection(section) {
  const data = CATALOG.categories[section] || [];
  
  const grid = document.getElementById(`grid-${section}`);
  if (grid) {
    if (data.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Nenhum produto nesta categoria</p></div>';
    } else {
      grid.innerHTML = data.map(p => `
        <div class="product-card">
          <div class="product-image-container">
            ${p.img ? `<img class="product-img" src="${p.img}" alt="${p.modelo}" onerror="this.style.display='none'; this.parentNode.querySelector('.product-img-placeholder').style.display='block';">` : ''}
            <div class="product-img-placeholder" style="display:${p.img ? 'none' : 'block'}">📦</div>
          </div>
          <div class="product-info">
            <div class="product-familia">${p.familia}</div>
            <div class="product-name">${p.modelo}</div>
            <div class="price-section">
              <div class="price-pix">${fmt(p.pix)} <span>PIX/Débito</span></div>
              ${p.x6 ? `<div class="price-parcel"><span>6x</span> <span>${fmt(p.x6)}</span></div>` : ''}
              ${p.x10 ? `<div class="price-parcel"><span>10x</span> <span>${fmt(p.x10)}</span></div>` : ''}
            </div>
            ${p.obs ? `<div class="obs-badge">🎁 ${p.obs}</div>` : ''}
          </div>
        </div>
      `).join('');
    }
  }

  const tbl = document.getElementById(`table-${section}`);
  if (tbl) {
    if (data.length === 0) {
      tbl.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">Nenhum produto nesta categoria</p>';
    } else {
      tbl.innerHTML = `
        <table>
          <thead><tr>
            <th>Família</th><th>Modelo</th>
            <th>PIX/Débito</th><th>6x</th><th>10x</th><th>Promoção</th>
          </tr></thead>
          <tbody>
            ${data.map(p => `
              <tr>
                <td class="td-familia">${p.familia}</td>
                <td>${p.modelo}</td>
                <td class="td-pix">${fmt(p.pix)}</td>
                <td>${p.x6 ? fmt(p.x6) : '—'}</td>
                <td>${p.x10 ? fmt(p.x10) : '—'}</td>
                <td style="color:var(--accent);font-size:0.85rem">${p.obs || ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  }
}

// FORMATAR PREÇO
function fmt(price) {
  if (!price) return '—';
  return new Intl.NumberFormat('pt-BR', {
    style: 'currency',
    currency: 'BRL',
    minimumFractionDigits: 0
  }).format(price);
}

// DEFINIR VISUALIZAÇÃO
function setView(section, view) {
  viewState[section] = view;
  
  document.querySelectorAll('.view-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && view === 'grid') || (i === 1 && view === 'table'));
  });
  
  const grid = document.getElementById(`grid-${section}`);
  const table = document.getElementById(`table-${section}`);
  if (grid) grid.style.display = view === 'grid' ? 'grid' : 'none';
  if (table) table.style.display = view === 'table' ? 'block' : 'none';
}

// BUSCAR PRODUTOS
function searchProducts(query) {
  if (!query.trim()) {
    renderSection(currentSection);
    return;
  }
  
  query = query.toLowerCase();
  const data = CATALOG.categories[currentSection] || [];
  const filtered = data.filter(p => 
    p.modelo.toLowerCase().includes(query) || 
    p.familia.toLowerCase().includes(query) ||
    (p.obs && p.obs.toLowerCase().includes(query))
  );
  
  const grid = document.getElementById(`grid-${currentSection}`);
  if (grid) {
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🔍</div><p>Nenhum produto encontrado para "' + query + '"</p></div>';
    } else {
      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-image-container">
            ${p.img ? `<img class="product-img" src="${p.img}" alt="${p.modelo}" onerror="this.style.display='none'; this.parentNode.querySelector('.product-img-placeholder').style.display='block';">` : ''}
            <div class="product-img-placeholder" style="display:${p.img ? 'none' : 'block'}">📦</div>
          </div>
          <div class="product-info">
            <div class="product-familia">${p.familia}</div>
            <div class="product-name">${p.modelo}</div>
            <div class="price-section">
              <div class="price-pix">${fmt(p.pix)} <span>PIX/Débito</span></div>
              ${p.x6 ? `<div class="price-parcel"><span>6x</span> <span>${fmt(p.x6)}</span></div>` : ''}
              ${p.x10 ? `<div class="price-parcel"><span>10x</span> <span>${fmt(p.x10)}</span></div>` : ''}
            </div>
            ${p.obs ? `<div class="obs-badge">🎁 ${p.obs}</div>` : ''}
          </div>
        </div>
      `).join('');
    }
  }
}

// INICIALIZAR
document.addEventListener('DOMContentLoaded', loadCatalog);
</script>
