<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung B2B - Mastercell | Soluções Corporativas</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --samsung-blue: #1428A0;
      --samsung-blue-dark: #0A1F4D;
      --white: #FFFFFF;
      --gray-light: #F8F9FA;
      --gray-medium: #E8E8E8;
      --text-primary: #2C3E50;
      --text-secondary: #7F8C8D;
      --accent: #0066CC;
      --success: #22c55e;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    /* Suporte a Dark Mode Automático */
    @media (prefers-color-scheme: dark) {
      :root {
        --white: #0f172a;
        --gray-light: #1e293b;
        --gray-medium: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --card-shadow: 0 4px 20px rgba(0,0,0,0.4);
      }
      header { background: #020617 !important; }
      .product-card { background: #1e293b !important; border-color: #334155 !important; }
      #searchInput { color: white; border-bottom-color: #334155; }
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--gray-light);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background 0.3s ease;
    }

    /* HEADER */
    header {
      background: var(--white);
      padding: 15px 60px;
      border-bottom: 1px solid var(--gray-medium);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--card-shadow);
    }

    .logo-samsung {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .logo-samsung span { color: var(--samsung-blue); }

    /* BADGE DO CARRINHO */
    .cart-btn-wrapper { position: relative; }
    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ef4444;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid var(--white);
    }

    /* HERO & SKELETON */
    .hero { padding: 60px 20px; text-align: center; }
    
    .skeleton {
      background: linear-gradient(90deg, var(--gray-medium) 25%, var(--gray-light) 50%, var(--gray-medium) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* PRODUCT CARD ENHANCEMENTS */
    .product-card {
      background: var(--white);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--gray-medium);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      border-color: var(--samsung-blue);
    }

    .tag-b2b {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--success);
      color: white;
      font-size: 0.65rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      padding: 40px 60px;
    }

    /* BOTÕES FLUTUANTES */
    .float-container {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 1000;
    }

    .btn-float {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .btn-float:hover { transform: scale(1.1); }
    .btn-whatsapp { background: #25D366; }
    .btn-cart { background: var(--samsung-blue); color: white; }

    /* MODAIS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .price-discount {
      color: var(--success);
      font-size: 0.85rem;
      font-weight: bold;
      display: none; /* Mostra apenas se qtd > 10 */
    }

    /* RESPONSIVIDADE */
    @media (max-width: 768px) {
      header { padding: 15px 20px; }
      .grid { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-samsung">SAMSUNG <span>B2B</span></div>
  <div class="cart-btn-wrapper" onclick="openCart()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--text-primary)"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    <div id="cartBadge" class="cart-badge" style="display: none;">0</div>
  </div>
</header>

<section class="hero">
  <h1>Soluções Corporativas <span>Premium</span></h1>
  <p>Compare especificações e solicite cotações em volume para sua empresa.</p>
  <div style="max-width: 600px; margin: 30px auto;">
    <input type="text" id="searchInput" placeholder="O que sua empresa precisa hoje?" 
           style="width: 100%; padding: 15px; border: none; border-bottom: 2px solid var(--gray-medium); background: transparent; font-size: 1.1rem; text-align: center;"
           onkeyup="filterProducts(this.value)">
  </div>
</section>

<div class="grid" id="mainGrid">
  <div class="skeleton" style="height: 350px;"></div>
  <div class="skeleton" style="height: 350px;"></div>
  <div class="skeleton" style="height: 350px;"></div>
</div>

<div class="float-container">
  <button class="btn-float btn-whatsapp" onclick="window.open('https://wa.me/41989031156')">
    <svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </button>
</div>

<div id="mainModal" class="modal" onclick="if(event.target==this) closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="modalBody"></div>
  </div>
</div>

<script>
let CATALOG = { categories: {} };
let cart = [];

// Carregamento com tratamento de erro
async function init() {
  try {
    const res = await fetch('precos.json');
    if (!res.ok) throw new Error();
    CATALOG = await res.json();
    renderProducts();
  } catch (e) {
    document.getElementById('mainGrid').innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
        <h3>Ops! Erro ao carregar o catálogo.</h3>
        <p>Verifique se o arquivo 'precos.json' está na mesma pasta.</p>
      </div>`;
  }
}

function renderProducts(filter = "") {
  const grid = document.getElementById('mainGrid');
  grid.innerHTML = "";
  
  Object.keys(CATALOG.categories).forEach(cat => {
    CATALOG.categories[cat].forEach((p, idx) => {
      if (filter && !p.modelo.toLowerCase().includes(filter.toLowerCase())) return;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <span class="tag-b2b">Solução Empresa</span>
        <div style="height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px;">
          <img src="${p.img || ''}" alt="${p.modelo}" loading="lazy" style="max-height: 100%; max-width: 100%;" 
               onerror="this.src='https://via.placeholder.com/200?text=Samsung'">
        </div>
        <div style="font-size: 0.75rem; color: var(--samsung-blue); font-weight: bold; text-transform: uppercase;">${p.familia}</div>
        <div style="font-weight: bold; margin: 5px 0 15px 0; font-size: 1.1rem;">${p.modelo}</div>
        <div style="border-top: 1px solid var(--gray-medium); padding-top: 15px;">
          <small>A partir de</small>
          <div style="font-size: 1.4rem; font-weight: 800; color: var(--samsung-blue);">${fmt(p.pix)}</div>
          <button onclick="showQtySelector('${cat}', ${idx})" 
                  style="width: 100%; background: var(--samsung-blue); color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold;">
            Cotar Volume
          </button>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

function showQtySelector(cat, idx) {
  const p = CATALOG.categories[cat][idx];
  const modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = `
    <h2>${p.modelo}</h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px;">Selecione a quantidade para sua empresa:</p>
    <input type="number" id="qtyInput" value="1" min="1" 
           style="width: 100%; padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 10px; border: 2px solid var(--samsung-blue); margin-bottom: 10px;"
           oninput="checkBulkDiscount(this.value)">
    <div id="bulkAlert" class="price-discount">✓ Aplicado desconto de 5% para volumes acima de 10 unidades!</div>
    <button onclick="addToCart('${cat}', ${idx})" 
            style="width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 10px; margin-top: 20px; font-weight: bold; cursor: pointer;">
      Adicionar à Proposta
    </button>
  `;
  document.getElementById('mainModal').style.display = 'flex';
}

function checkBulkDiscount(val) {
  const alert = document.getElementById('bulkAlert');
  alert.style.display = val >= 10 ? 'block' : 'none';
}

function addToCart(cat, idx) {
  const p = CATALOG.categories[cat][idx];
  const qty = parseInt(document.getElementById('qtyInput').value);
  
  // Lógica B2B: Desconto progressivo
  let finalPrice = p.pix;
  if (qty >= 10) finalPrice = p.pix * 0.95;

  cart.push({ ...p, qty, finalPrice });
  updateBadge();
  closeModal();
}

function updateBadge() {
  const badge = document.getElementById('cartBadge');
  const total = cart.reduce((acc, item) => acc + item.qty, 0);
  badge.innerText = total;
  badge.style.display = total > 0 ? 'block' : 'none';
}

function openCart() {
  if (cart.length === 0) { alert("Sua proposta está vazia!"); return; }
  
  const modalBody = document.getElementById('modalBody');
  let total = 0;
  
  let html = `<h2>Resumo da Proposta</h2><div style="margin: 20px 0;">`;
  cart.forEach((item, i) => {
    const subtotal = item.finalPrice * item.qty;
    total += subtotal;
    html += `
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--gray-medium); padding: 10px 0;">
        <div><strong>${item.qty}x</strong> ${item.modelo}</div>
        <div>${fmt(subtotal)}</div>
      </div>`;
  });
  
  html += `</div>
    <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; color: var(--samsung-blue); margin-bottom: 25px;">
      <span>Total Estimado:</span>
      <span>${fmt(total)}</span>
    </div>
    <button onclick="sendToWhatsApp()" style="width: 100%; background: #25D366; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer;">
      Enviar para Consultor B2B
    </button>
    <button onclick="cart=[]; updateBadge(); closeModal();" style="width: 100%; background: transparent; color: #ef4444; border: none; margin-top: 10px; cursor: pointer;"> Limpar Proposta </button>
  `;
  
  modalBody.innerHTML = html;
  document.getElementById('mainModal').style.display = 'flex';
}

function sendToWhatsApp() {
  let msg = "Olá Mastercell! Gostaria de uma cotação B2B para:\n\n";
  cart.forEach(item => {
    msg += `• ${item.qty}x ${item.modelo} (${fmt(item.finalPrice)} un.)\n`;
  });
  window.open(`https://wa.me/41989031156?text=${encodeURIComponent(msg)}`);
}

function filterProducts(val) { renderProducts(val); }
function closeModal() { document.getElementById('mainModal').style.display = 'none'; }
function fmt(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val); }

init();
</script>
</body>
</html>
