<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Gerenciar Preços</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    header h1 {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    
    header p {
      opacity: 0.9;
      font-size: 0.95rem;
    }
    
    .content {
      padding: 30px;
    }
    
    .section {
      margin-bottom: 40px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
    }
    
    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .btn-danger {
      background: #ff6b6b;
      color: white;
    }
    
    .btn-danger:hover {
      background: #ff5252;
    }
    
    .btn-success {
      background: #51cf66;
      color: white;
    }
    
    .btn-success:hover {
      background: #40c057;
    }
    
    input[type="text"],
    input[type="number"],
    textarea,
    select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    
    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .product-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid #f0f0f0;
    }
    
    .product-row:hover {
      background: #f5f5f5;
    }
    
    .product-row label {
      font-weight: 600;
      color: #666;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .product-row input {
      width: 100%;
    }
    
    .product-modelo {
      grid-column: 1;
    }
    
    .product-pix {
      grid-column: 2;
    }
    
    .product-x6 {
      grid-column: 3;
    }
    
    .product-x10 {
      grid-column: 4;
    }
    
    .product-obs {
      grid-column: 5;
    }
    
    .product-actions {
      grid-column: 6;
      display: flex;
      gap: 5px;
    }
    
    .product-actions button {
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-card h3 {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    
    .stat-card p {
      opacity: 0.9;
      font-size: 0.9rem;
    }
    
    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
    
    .message.show {
      display: block;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .footer {
      background: #f9f9f9;
      padding: 20px 30px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }
    
    .add-product-form {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    
    .form-row label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
    }
    
    .form-row input,
    .form-row select {
      width: 100%;
    }
    
    @media (max-width: 768px) {
      .product-row {
        grid-template-columns: 1fr;
      }
      
      .product-row label {
        display: block;
        margin-bottom: 5px;
      }
      
      .product-modelo,
      .product-pix,
      .product-x6,
      .product-x10,
      .product-obs,
      .product-actions {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚙️ Painel Administrativo</h1>
    <p>Gerenciar preços do catálogo Samsung Jockey Plaza</p>
  </header>
  
  <div class="content">
    <!-- Mensagens -->
    <div id="message" class="message"></div>
    
    <!-- Estatísticas -->
    <div class="stats">
      <div class="stat-card">
        <h3 id="totalProducts">0</h3>
        <p>Produtos Total</p>
      </div>
      <div class="stat-card">
        <h3 id="totalCategories">0</h3>
        <p>Categorias</p>
      </div>
      <div class="stat-card">
        <h3 id="lastUpdate">—</h3>
        <p>Última Atualização</p>
      </div>
    </div>
    
    <!-- Controles Gerais -->
    <div class="controls">
      <button class="btn-primary" onclick="loadCatalog()">🔄 Recarregar</button>
      <button class="btn-success" onclick="saveCatalog()">💾 Salvar Alterações</button>
      <button class="btn-secondary" onclick="exportJSON()">📥 Exportar JSON</button>
      <button class="btn-secondary" onclick="importJSON()">📤 Importar JSON</button>
    </div>
    
    <!-- Abas de Categorias -->
    <div style="margin-bottom: 20px;">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn-secondary" onclick="switchCategory('smartphones')" style="background: #667eea; color: white;">📱 Smartphones</button>
        <button class="btn-secondary" onclick="switchCategory('dobráveis')">🔄 Dobráveis</button>
        <button class="btn-secondary" onclick="switchCategory('tablets')">📟 Tablets</button>
        <button class="btn-secondary" onclick="switchCategory('notebooks')">💻 Notebooks</button>
        <button class="btn-secondary" onclick="switchCategory('wearables')">⌚ Wearables</button>
        <button class="btn-secondary" onclick="switchCategory('acessorios')">🎧 Acessórios</button>
      </div>
    </div>
    
    <!-- Seção de Produtos -->
    <div id="categorySection" class="section">
      <div class="section-title" id="categoryTitle">📱 Smartphones</div>
      
      <div class="controls">
        <button class="btn-primary" onclick="addProduct()">➕ Adicionar Produto</button>
      </div>
      
      <div id="productsContainer"></div>
    </div>
  </div>
  
  <div class="footer">
    <p>💡 Dica: Todas as alterações são salvas localmente. Clique em "Salvar Alterações" para fazer download do arquivo atualizado.</p>
  </div>
</div>

<script>
let catalog = {};
let currentCategory = 'smartphones';

// Carregar catálogo
async function loadCatalog() {
  try {
    const response = await fetch('precos.json');
    catalog = await response.json();
    
    // Atualizar estatísticas
    let totalProducts = 0;
    for (let cat in catalog.categories) {
      totalProducts += catalog.categories[cat].length;
    }
    
    document.getElementById('totalProducts').textContent = totalProducts;
    document.getElementById('totalCategories').textContent = Object.keys(catalog.categories).length;
    document.getElementById('lastUpdate').textContent = catalog.lastUpdated || '—';
    
    renderCategory(currentCategory);
    showMessage('✅ Catálogo carregado com sucesso!', 'success');
  } catch (error) {
    showMessage('❌ Erro ao carregar catálogo: ' + error.message, 'error');
    console.error(error);
  }
}

// Renderizar categoria
function renderCategory(category) {
  currentCategory = category;
  const products = catalog.categories[category] || [];
  const container = document.getElementById('productsContainer');
  
  // Atualizar título
  const icons = {
    smartphones: '📱',
    dobráveis: '🔄',
    tablets: '📟',
    notebooks: '💻',
    wearables: '⌚',
    acessorios: '🎧'
  };
  
  document.getElementById('categoryTitle').textContent = 
    `${icons[category] || '📦'} ${category.charAt(0).toUpperCase() + category.slice(1)}`;
  
  // Renderizar produtos
  container.innerHTML = '';
  
  products.forEach((product, index) => {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `
      <input type="text" value="${product.modelo}" onchange="updateProduct(${index}, 'modelo', this.value)" placeholder="Nome do produto">
      <input type="number" value="${product.pix || ''}" onchange="updateProduct(${index}, 'pix', this.value)" placeholder="PIX">
      <input type="number" value="${product.x6 || ''}" onchange="updateProduct(${index}, 'x6', this.value)" placeholder="6x">
      <input type="number" value="${product.x10 || ''}" onchange="updateProduct(${index}, 'x10', this.value)" placeholder="10x">
      <input type="text" value="${product.obs || ''}" onchange="updateProduct(${index}, 'obs', this.value)" placeholder="Observação">
      <div class="product-actions">
        <button class="btn-danger" onclick="deleteProduct(${index})">🗑️</button>
      </div>
    `;
    container.appendChild(row);
  });
  
  if (products.length === 0) {
    container.innerHTML = '<p style="text-align: center; color: #999;">Nenhum produto nesta categoria</p>';
  }
}

// Atualizar produto
function updateProduct(index, field, value) {
  const products = catalog.categories[currentCategory];
  if (field === 'pix' || field === 'x6' || field === 'x10') {
    products[index][field] = value ? parseInt(value) : null;
  } else {
    products[index][field] = value;
  }
}

// Deletar produto
function deleteProduct(index) {
  if (confirm('Tem certeza que deseja deletar este produto?')) {
    catalog.categories[currentCategory].splice(index, 1);
    renderCategory(currentCategory);
    showMessage('✅ Produto deletado!', 'success');
  }
}

// Adicionar produto
function addProduct() {
  const newProduct = {
    familia: '',
    modelo: 'Novo Produto',
    pix: 0,
    x6: null,
    x10: null,
    obs: '',
    img: ''
  };
  
  catalog.categories[currentCategory].push(newProduct);
  renderCategory(currentCategory);
  showMessage('✅ Novo produto adicionado!', 'success');
}

// Salvar catálogo
function saveCatalog() {
  catalog.lastUpdated = new Date().toISOString().split('T')[0];
  
  const dataStr = JSON.stringify(catalog, null, 2);
  const dataBlob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'precos.json';
  link.click();
  
  showMessage('✅ Arquivo salvo! Faça upload do arquivo "precos.json" para seu servidor.', 'success');
}

// Exportar JSON
function exportJSON() {
  saveCatalog();
}

// Importar JSON
function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        catalog = JSON.parse(event.target.result);
        loadCatalog();
        showMessage('✅ Arquivo importado com sucesso!', 'success');
      } catch (error) {
        showMessage('❌ Erro ao importar arquivo: ' + error.message, 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Trocar categoria
function switchCategory(category) {
  renderCategory(category);
  
  // Atualizar botões
  document.querySelectorAll('button').forEach(btn => {
    if (btn.textContent.includes(category.charAt(0).toUpperCase() + category.slice(1))) {
      btn.style.background = '#667eea';
      btn.style.color = 'white';
    } else if (btn.classList.contains('btn-secondary') && !btn.classList.contains('btn-primary')) {
      btn.style.background = '#f0f0f0';
      btn.style.color = '#333';
    }
  });
}

// Mostrar mensagem
function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `message show ${type}`;
  setTimeout(() => {
    msg.classList.remove('show');
  }, 4000);
}

// Carregar ao iniciar
document.addEventListener('DOMContentLoaded', loadCatalog);
</script>

</body>
</html>
